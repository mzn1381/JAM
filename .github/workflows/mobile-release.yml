name: 📱 Mobile → Build & Release APK

on:
  push:
    tags:
      - 'mobile-v*'
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Version name override (e.g. 1.2.3). Leave empty to auto-increment.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  # test:
  #   name: 🧪 Run Tests
  #   runs-on: ubuntu-latest
  #   defaults:
  #     run:
  #       working-directory: mobile
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v4

  #     - name: Set up Node.js
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: 20
  #         cache: 'npm'
  #         cache-dependency-path: mobile/package-lock.json

  #     - name: Install dependencies
  #       run: npm ci

  #     - name: Run lint
  #       run: npm run lint

  #     - name: Run tests
  #       run: npm test -- --ci --passWithNoTests

  build-android:
    name: 🤖 Build Android Release APK
    # needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.yarnpkg.com'
          cache: 'yarn'
          cache-dependency-path: mobile/yarn.release.lock

      - name: Install dependencies (using public registry lockfile)
        run: |
          if [ -f yarn.release.lock ]; then
            cp yarn.release.lock yarn.lock
            yarn install
          else
            rm -f yarn.lock
            yarn install
            cp yarn.lock yarn.release.lock
          fi

          cd $GITHUB_WORKSPACE
          if ! git diff --quiet mobile/yarn.release.lock 2>/dev/null || [ ! -f mobile/yarn.release.lock ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add mobile/yarn.release.lock
            git commit -m "chore: update yarn.release.lock for CI [skip ci]" || true
            git push origin HEAD:${{ github.event.repository.default_branch }} || true
          fi

      - name: Calculate version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version_override }}" ]; then
            VERSION_NAME="${{ github.event.inputs.version_override }}"
            # Extract patch number as version code
            VERSION_CODE=$(echo "$VERSION_NAME" | awk -F. '{print $1*10000 + $2*100 + $3}')
          elif [[ "$GITHUB_REF" == refs/tags/mobile-v* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/mobile-v}"
            VERSION_CODE=$(echo "$VERSION_NAME" | awk -F. '{print $1*10000 + $2*100 + $3}')
          else
            # Auto-increment from version.properties
            CURRENT_CODE=$(grep "VERSION_CODE" android/version.properties | cut -d'=' -f2 | tr -d '[:space:]')
            VERSION_CODE=$((CURRENT_CODE + 1))
            VERSION_NAME="0.0.${VERSION_CODE}"
          fi

          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "📦 Building version: $VERSION_NAME (code: $VERSION_CODE)"

      - name: Write version.properties
        run: |
          cat > android/version.properties <<EOF
          VERSION_CODE=${{ steps.version.outputs.version_code }}
          VERSION_NAME=${{ steps.version.outputs.version_name }}
          EOF

      - name: Commit updated version.properties
        run: |
          cd $GITHUB_WORKSPACE
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mobile/android/version.properties
          git commit -m "chore: bump mobile version to ${{ steps.version.outputs.version_name }} [skip ci]" || true
          git push origin HEAD:${{ github.event.repository.default_branch }} || true

      - name: Decode release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/pish-release-key.keystore

      - name: Set up signing properties
        run: |
          cat >> android/gradle.properties <<EOF

          MYAPP_UPLOAD_STORE_FILE=pish-release-key.keystore
          MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
            mobile/android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/android/gradle/wrapper/gradle-wrapper.properties', 'mobile/android/**/*.gradle', 'mobile/android/app/**/*.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Rewrite Gradle repos to use public registries
        run: |
          # Uncomment google() and mavenCentral(), remove entire maven { nexus } blocks
          sed -i \
            -e 's|// google()|google()|g' \
            -e 's|// mavenCentral()|mavenCentral()|g' \
            android/build.gradle
          # Remove the entire maven { url "https://nexus..." } blocks (multi-line)
          python3 -c "
          import re
          with open('android/build.gradle', 'r') as f:
              content = f.read()
          content = re.sub(r'\s*maven\s*\{\s*\n\s*url\s*\"https://nexus\.mypishkar\.ir[^\"]*\"\s*\n\s*\}', '', content)
          with open('android/build.gradle', 'w') as f:
              f.write(content)
          "
          echo "=== build.gradle after rewrite ==="
          cat android/build.gradle

      - name: Build release APK
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
        run: |
          cd android
          # Single Gradle invocation: codegen + assembleRelease together
          # - Use Gradle daemon for JIT warmup across tasks
          # - Enable build cache for incremental builds
          # - Parallel execution is already on via gradle.properties
          ./gradlew generateCodegenArtifactsFromSchema assembleRelease \
            -PMYAPP_UPLOAD_STORE_FILE=pish-release-key.keystore \
            --no-configure-on-demand \
            --build-cache \
            --max-workers=4 \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pishkar-release-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

  release:
    name: 🚀 Create GitHub Release
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: pishkar-release-apk
          path: ./apk

      - name: Rename APK
        run: |
          mv ./apk/*.apk ./apk/pishkar-v${{ needs.build-android.outputs.version_name }}.apk

      - name: Generate release notes
        id: notes
        run: |
          VERSION="mobile-v${{ needs.build-android.outputs.version_name }}"
          
          # Get commits since last mobile tag
          LAST_TAG=$(git tag -l "mobile-v*" --sort=-v:refname | head -n 1)
          
          if [ -n "$LAST_TAG" ] && [ "$LAST_TAG" != "$VERSION" ]; then
            CHANGES=$(git log ${LAST_TAG}..HEAD --oneline --no-merges -- mobile/ | head -20)
          else
            CHANGES=$(git log --oneline --no-merges -10 -- mobile/)
          fi

          {
            echo "body<<RELEASE_EOF"
            echo "## 📱 Pishkar Mobile v${{ needs.build-android.outputs.version_name }}"
            echo ""
            echo "**Version Code:** ${{ needs.build-android.outputs.version_code }}"
            echo ""
            echo "### Changes"
            echo ""
            if [ -n "$CHANGES" ]; then
              echo "$CHANGES" | while read -r line; do echo "- $line"; done
            else
              echo "- Release build"
            fi
            echo ""
            echo "### Installation"
            echo "Download the APK file below and install it on your Android device."
            echo "RELEASE_EOF"
          } >> $GITHUB_OUTPUT

      - name: Create or update Git tag
        run: |
          TAG="mobile-v${{ needs.build-android.outputs.version_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Create tag only if triggered by workflow_dispatch (tag already exists for tag pushes)
          if [[ "$GITHUB_REF" != refs/tags/mobile-v* ]]; then
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-v${{ needs.build-android.outputs.version_name }}
          name: "📱 Pishkar Mobile v${{ needs.build-android.outputs.version_name }}"
          body: ${{ steps.notes.outputs.body }}
          files: ./apk/pishkar-v${{ needs.build-android.outputs.version_name }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: iran-university-of-science-and
          SENTRY_PROJECT: react-native
