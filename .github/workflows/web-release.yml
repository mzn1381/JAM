name: Web -> Build & Release Docker Image

on:
  push:
    branches:
      - develop
    paths:
      - 'web/**'
      - '.github/workflows/web-release.yml'
  pull_request:
    branches:
      - develop
    paths:
      - 'web/**'
      - '.github/workflows/web-release.yml'
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Optional version tag such as web-v1.2.3. Leave empty to increment the latest patch version.'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  validate:
    name: Validate web project
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build

  build-and-push:
    name: Build and push web image
    needs: validate
    if: |
      (github.event_name == 'push' &&
      github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.new_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: version
        env:
          VERSION_OVERRIDE: ${{ inputs.version_override || '' }}
        run: |
          set -euo pipefail

          if [[ -n "$VERSION_OVERRIDE" ]]; then
            if [[ ! "$VERSION_OVERRIDE" =~ ^web-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid version: $VERSION_OVERRIDE"
              echo "Expected format: web-v1.2.3"
              exit 1
            fi

            if git rev-parse --verify --quiet "refs/tags/$VERSION_OVERRIDE"; then
              echo "Tag already exists: $VERSION_OVERRIDE"
              exit 1
            fi

            NEW_VERSION="$VERSION_OVERRIDE"
          else
            LATEST_TAG=$(git tag -l "web-v*.*.*" --sort=-v:refname | head -n 1)

            if [[ -z "$LATEST_TAG" ]]; then
              NEW_VERSION="web-v0.0.1"
            else
              VERSION="${LATEST_TAG#web-v}"
              MAJOR=$(echo "$VERSION" | cut -d. -f1)
              MINOR=$(echo "$VERSION" | cut -d. -f2)
              PATCH=$(echo "$VERSION" | cut -d. -f3)
              PATCH=$((PATCH + 1))
              NEW_VERSION="web-v${MAJOR}.${MINOR}.${PATCH}"
            fi
          fi

          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create and push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.new_version }}
          git push origin ${{ steps.version.outputs.new_version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: |
            ${{ secrets.WEB_IMAGE_NAME }}:${{ steps.version.outputs.new_version }}
            ${{ secrets.WEB_IMAGE_NAME }}:latest

  deploy:
    name: Deploy web
    needs: build-and-push
    if: |
      (github.event_name == 'push' &&
      github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -e
            VERSION="${{ needs.build-and-push.outputs.version }}"
            echo "Deploying web version: $VERSION"
            docker pull ${{ secrets.WEB_IMAGE_NAME }}:$VERSION

            cd /home/${{ secrets.VPS_USER }}/opt/web || exit 1

            if grep -q "^WEB_IMAGE_TAG=" .env 2>/dev/null; then
              sed -i "s/^WEB_IMAGE_TAG=.*/WEB_IMAGE_TAG=$VERSION/" .env
            else
              echo "WEB_IMAGE_TAG=$VERSION" >> .env
            fi

            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            echo "Deployed web version $VERSION successfully"
