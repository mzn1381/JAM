apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"


def getVersionCode = { ->
    def versionFile = file("${project.rootDir}/version.properties")

    if (!versionFile.exists()) {
        versionFile.write("VERSION_CODE=1\nVERSION_NAME=0.0.1")
    }

    def Properties props = new Properties()
    props.load(new FileInputStream(versionFile))

    def code = props["VERSION_CODE"].toInteger()
    def name = "0.0." + code

    props["VERSION_CODE"] = code.toString()
    props["VERSION_NAME"] = name
    props.store(versionFile.newWriter(), null)

    return code
}

def getVersionName = { ->
    def versionFile = file("${project.rootDir}/version.properties")
    def Properties props = new Properties()
    props.load(new FileInputStream(versionFile))
    return props["VERSION_NAME"]
}



